[toolchain]
anchor_version = "0.31.1"

[features]
resolution = true
skip-lint = false

[programs.localnet]
meme_lending = "9VHZhNZkrsocLmafGBmbG2mCiAnwA1WaBTG1aNb2kr4j"

[registry]
url = "https://api.apr.dev"

[provider]
cluster = "localnet"
wallet = "~/.config/solana/id.json"

[scripts]
test = "node --experimental-strip-types --test tests/anchor/src/*.test.ts"

[test]
startup_wait = 10000
shutdown_wait = 2000
upgradeable = true
