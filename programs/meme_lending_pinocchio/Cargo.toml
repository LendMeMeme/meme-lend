[package]
name = "meme_lending_pinocchio"
version = "0.1.0"
description = "Optimized Pinocchio implementation of Meme Lend"
edition = "2021"
license = "Apache-2.0"

[lib]
crate-type = ["cdylib", "lib"]
name = "meme_lending_pinocchio"

[features]
default = []
bpf-entrypoint = []

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }

[dependencies]
pinocchio = { version = "0.11.0", default-features = false }
solana-security-txt = "1.1.3"
