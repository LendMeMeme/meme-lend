name: Verifiable Solana program

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "programs/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "Anchor.toml"
      - ".github/workflows/verifiable-program.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.89.0

      - uses: Swatinem/rust-cache@v2

      - name: Install the official verified-build CLI
        run: cargo install --git https://github.com/solana-foundation/solana-verifiable-build --rev 17e839a8 --locked solana-verify

      - name: Build optimized Pinocchio program in the pinned verifier image
        run: |
          solana-verify build . --workspace-path . --library-name meme_lending_pinocchio -- --features bpf-entrypoint
          mkdir -p target/verifiable
          cp target/deploy/meme_lending_pinocchio.so target/verifiable/meme_lending_pinocchio.so

      - name: Verify embedded security metadata
        run: |
          cargo install query-security-txt --locked
          query-security-txt target/verifiable/meme_lending_pinocchio.so | tee target/verifiable/security-pinocchio.txt

      - name: Record binary digest
        run: |
          sha256sum target/verifiable/meme_lending_pinocchio.so | tee target/verifiable/meme_lending_pinocchio.so.sha256

      - uses: actions/upload-artifact@v6
        with:
          name: meme-lending-verifiable-${{ github.sha }}
          path: |
            target/verifiable/meme_lending_pinocchio.so
            target/verifiable/meme_lending_pinocchio.so.sha256
            target/verifiable/security-pinocchio.txt
          if-no-files-found: error
          retention-days: 90
