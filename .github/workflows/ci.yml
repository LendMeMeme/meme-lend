name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false
      - run: corepack enable && corepack prepare pnpm@11.19.0 --activate
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.89.0
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: pnpm install --frozen-lockfile
      - run: cargo fmt --check
      - run: cargo test -p meme_lending --lib
      - run: cargo check -p meme_lending_pinocchio --features bpf-entrypoint
      - run: cargo test -p meme_lending_pinocchio --lib
      - run: pnpm check
      - run: pnpm test
      - run: pnpm format
      - run: pnpm build
